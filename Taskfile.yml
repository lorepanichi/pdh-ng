# https://taskfile.dev

version: '3'

tasks:
  default:
    cmds:
      - task -l
    silent: true

  dependency-install:
    cmds:
      - uv sync
    sources:
      - uv.lock
      - pyproject.toml
    generates:
      - uv.lock
    method: checksum

  install-hooks:
    desc: Install pre-commit git hooks
    cmds:
      - pre-commit install
    sources:
      - .pre-commit-config.yaml
    generates:
      - .git/hooks/pre-commit
      - .git/hooks/commit-msg
    method: checksum

  setup:
    desc: Install dependencies and git hooks (run after clone)
    cmds:
      - task: dependency-install
      - task: install-hooks

  lint:
    desc: Run ruff linter and formatter (auto-fix)
    cmds:
      - uv run ruff check --fix src/ tests/
      - uv run ruff format src/ tests/

  test:
    desc: Run tests
    cmds:
      - uv run pytest tests/

  check:
    desc: Run lint, tests, and all pre-commit hooks
    cmds:
      - task: lint
      - task: test
      - pre-commit run -a
