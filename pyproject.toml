[project]
name = "pdh-ng"
version = "0.2.4"
description = "PDH New Generation"
authors = [
    {name = "Lorenzo Panichi", email = "lorenzo@panichi.org"}
]
license = {text = "MIT"}
urls = {"Source" = "https://github.com/lorepanichi/pdh-ng"}
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "rich>=14.2.0",
    "pyyaml>=6.0.2,<7.0.0",
    "humanize>=4.10.0,<5.0.0",
    "pagerduty>=4.0.1,<7.0.0",
    "textual>=8.1.1",
]

[project.optional-dependencies]
build = ["uv>=0.8.17"]

[project.scripts]
pdh-ng = "pdh_ng.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pdh_ng"]

[dependency-groups]
dev = [
    "pytest>=8.3.3",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=6.0.0",
    "pytest-mock>=3.14.0",
    "ruff>=0.11.2",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"

[tool.semantic_release]
version_toml = ["pyproject.toml:project.version"]
allow_zero_version = true
build_command = """
    python -m pip install -e '.[build]'
    uv lock --upgrade-package "$PACKAGE_NAME"
    git add uv.lock
    uv build
"""
tag_format = "v{version}"
upload_to_pypi = false

[tool.uv]
required-version = ">=0.8.17"

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "F",   # pyflakes
    "W",   # pycodestyle warnings
    "C",   # flake8-comprehensions
    "I",   # isort
    "UP",  # pyupgrade
]
ignore = [
    "C408",  # unnecessary dict call
    "C901",  # function too complex
    "C416",  # unnecessary list comprehension
]
